description: >-
  BugSnag is an application stability monitoring platform from SmartBear that helps software teams
  detect, diagnose and fix errors in web, mobile, desktop and back-end applications. It combines
  error monitoring, real user monitoring and end-to-end distributed tracing behind a stability score
  that tells a team whether a release is safe to ship. BugSnag publishes six OpenAPI 3.0 definitions
  on SwaggerHub under the smartbear-public organization: a 141-operation Data Access API on
  api.bugsnag.com (errors, events, projects, releases, span groups, traces, feature flags and a full
  SCIM 2.0 provisioning surface), plus ingest and build-time APIs for error reporting
  (notify.bugsnag.com), session tracking (sessions.bugsnag.com), OTLP trace ingest
  (otlp.bugsnag.com), build notification (build.bugsnag.com) and symbol/source-map upload
  (upload.bugsnag.com). Agent access is first class: SmartBear runs a hosted MCP server at
  bugsnag.mcp.smartbear.com behind OAuth 2.1, and ships the same 19 BugSnag tools in the local
  @smartbear/mcp npm package.

