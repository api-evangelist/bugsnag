deprecation:
  policy_published: true
  policy_url: https://developer.smartbear.com/bugsnag/docs/data-access-versioning
  mechanism: version decommissioning
  summary: >-
    Deprecation is handled by retiring a whole API version, not by marking
    individual operations. v1 of the Data Access API has been decommissioned;
    v2 is current.
  rfc8594_headers:
