source: >-
  https://www.npmjs.com/package/@smartbear/mcp (v0.41.0, published 2026-09-17) ,
  https://github.com/SmartBear/smartbear-mcp ,
  https://developer.smartbear.com/smartbear-mcp/docs/bugsnag-integration ,
