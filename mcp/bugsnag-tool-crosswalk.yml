description: >-
  Binds each BugSnag MCP tool to the Data Access API operation(s) that back it,
  so an agent that cannot reach the auth-gated MCP server can still see what the
  tool does and call the same capability over REST. The live tools/list is
  OAuth-gated (401), so bindings are mapped by published name and semantics
  against real operationIds grepped from the spec — confidence is recorded per
  row and never inflated.
