        managed_by_smartbear_id:
          type: boolean
          example: true
          description: Whether the user is managed by SmartBear ID
      required:
      - id
      - email
      - two_factor_enabled
      - show_time_in_utc
      - heroku
      - created_at
      - managed_by_smartbear_id
