openapi: 3.2.0
info:
  title: Bugsnag Errors API
  version: '1.0'
  description: 'Operations tagged Errors across 2 of this provider''s published API definitions: bugsnag-data-access-openapi.yml, bugsnag-data-access-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.bugsnag.com
  description: Bugsnag Production API Server
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
- description: For organizations with projects on app.bugsnag.smartbear.com
  url: https://api.bugsnag.smartbear.com
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
security:
- tokenAuth: []
tags:
- name: Errors
  description: Access and manage errors within projects. Errors represent groups of similar events that have been detected by Bugsnag.
paths:
  /projects/{project_id}/errors:
    get:
      operationId: listProjectErrors
      summary: List project errors
      description: Returns a list of errors for the specified project. Errors can be filtered by status, severity, and other criteria. Results are paginated using the Link header.
      tags:
      - Errors
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PerPage'
      - name: sort
        in: query
        description: The field to sort results by. Supported values include last_seen, first_seen, users, events, and unsorted.
        schema:
          type: string
          enum:
          - last_seen
          - first_seen
          - users
          - events
          - unsorted
      - name: direction
        in: query
        description: The sort direction, either ascending or descending.
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: status
        in: query
        description: Filter errors by their status.
        schema:
          type: string
          enum:
          - open
          - fixed
          - snoozed
          - ignored
      - name: severity
        in: query
        description: Filter errors by their severity level.
        schema:
          type: string
          enum:
          - error
          - warning
          - info
      - name: release_stage
        in: query
        description: Filter errors by the release stage in which they occurred.
        schema:
          type: string
      - name: q
        in: query
        description: A full-text search query to filter errors by their error class, message, or context.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Errors
      summary: Bulk Update Errors
      operationId: bulkUpdateErrors
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        example: 515fb9337c1074f6fd000003
      - name: error_ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
        example:
        - 515fb9337c1074f6fd000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorUpdateRequest'
      responses:
        '200':
          description: Bulk operation result for errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation:
                    type: string
                    enum:
                    - overridden_severity
                    - assign
                    - create_issue
                    - link_issue
                    - unlink_issue
                    - open
                    - snooze
                    - fix
                    - ignore
                    - delete
                    - discard
                  515fb9337c1074f6fd000001:
                    type: object
                    properties:
                      assigned_collaborator_id:
                        type: string
                      assigned_team_id:
                        type: string
                      linked_issues:
                        type: array
                        items:
                          $ref: '#/components/schemas/ErrorCreatedIssue'
                      created_issue:
                        $ref: '#/components/schemas/ErrorCreatedIssue'
                      reopen_rules:
                        $ref: '#/components/schemas/ErrorReopenRules'
                      status:
                        $ref: '#/components/schemas/ErrorStatus'
                      discarded:
                        type: boolean
        '404':
          description: Project or User could not be found. Check the supplied project_id or assigned_collaborator_id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Project not found
                  - User not found
    delete:
      tags:
      - Errors
      summary: Delete all Errors in a Project
      operationId: deleteAllErrorsInProject
      description: Deletes all Error and Event data in a project. Use with caution. This action cannot be reversed.
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        example: 515fb9337c1074f6fd000003
      responses:
        '204':
          description: All errors deleted successfully.
        '404':
          description: Project could not be found. Check the supplied project_id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Project not found
    servers:
    - url: https://api.bugsnag.com
      description: Bugsnag Production API Server
  /projects/{project_id}/errors/{error_id}:
    get:
      operationId: getError
      summary: Get an error
      description: Returns the details of a specific error, including its error class, message, severity, status, event count, and user count.
      tags:
      - Errors
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ErrorId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateError
      summary: Update an error
      description: Updates the status or severity of an error. Use this to resolve, snooze, ignore, or reopen errors.
      tags:
      - Errors
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ErrorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteError
      summary: Delete an error
      description: Permanently deletes an error and all of its associated events.
      tags:
      - Errors
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ErrorId'
      responses:
        '204':
          description: Error deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: https://api.bugsnag.com
      description: Bugsnag Production API Server
  /projects/{project_id}/events/{event_id}:
    delete:
      tags:
      - Errors
      summary: Delete an Event
      operationId: deleteEventById
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        example: 337515fb9c1074f6fd000001
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        example: 515fb9337c1074f6fd000009
      responses:
        '204':
          description: ''
        '404':
          description: Event could not be found. Check the supplied `event_id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Event not found
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
  /errors/{error_id}/latest_event:
    get:
      tags:
      - Errors
      summary: View the latest Event on an Error
      operationId: viewLatestEventOnError
      parameters:
      - name: error_id
        in: path
        required: true
        schema:
          type: string
        example: 515fb9337c1074f6fd000001
      responses:
        '200':
          description: Latest event details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApiView'
        '404':
          description: Error could not be found. Check the supplied error_id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Error not found
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
  /projects/{project_id}/events:
    get:
      tags:
      - Errors
      summary: List the Events on a Project
      operationId: listEventsOnProject
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        example: 515fb9337c1074f6fd000003
      - name: base
        in: query
        required: false
        schema:
          type: string
          format: date-time
        example: '2017-04-12T22:50:04Z'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - timestamp
          default: timestamp
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: per_page
        in: query
        required: false
        schema:
          type: number
          default: 30
      - name: filters
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Filters'
      - name: filter_groups
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AdvancedFiltersFilterGroups'
      - name: filter_groups_join
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FilterGroupsJoinOperator'
      - name: full_reports
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A list of events on the project.
          headers:
            Link:
              schema:
                type: string
              example: <https://api.bugsnag.com/projects/515fb9337c1074f6fd000003/events?offset=590bce131f7314d98eac23ba&sort=timestamp>; rel="next"
            X-Total-Count:
              schema:
                type: integer
              example: 123
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElasticSearchEventApiView'
        '404':
          description: Error could not be found. Check the supplied error_id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Error not found
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
  /projects/{project_id}/errors/{error_id}/trends:
    get:
      tags:
      - Errors
      summary: List the Trends for an Error
      operationId: getBucketedAndUnbucketedTrendsOnError
      description: Counts for an Error in a given time range, suitable for drawing histograms. Will return a maximum of 50 buckets (when using `buckets_count`) or 2000 data points (when using `resolution`).
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the Project
      - name: error_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the error
      - name: filters
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Filters'
      - name: filter_groups
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AdvancedFiltersFilterGroups'
      - name: filter_groups_join
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FilterGroupsJoinOperator'
        description: Search filters to restrict the events reported in the trend
      - name: buckets_count
        in: query
        required: false
        schema:
          type: number
        description: Number of buckets to group trend data into (max 50)
      - name: resolution
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 30m
          - 2h
          - 12h
        description: The trend data will be grouped so that each bucket spans the given time period
      responses:
        '200':
          description: Trend data for the error (bucketed or unbucketed).
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/Trend1'
                  - $ref: '#/components/schemas/Trend2'
        '400':
          description: '- Returned when the number of data points required to respond to the request would exceed the maximum.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                - Buckets count must be between 1 and 50
                - Too many data points requested. Please use a narrower time range or lower resolution.
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
  /projects/{project_id}/trends:
    get:
      tags:
      - Errors
      summary: List the Trends for a Project
      operationId: getBucketedAndUnbucketedTrendsOnProject
      description: Counts for a Project in a given time range, suitable for drawing histograms. Will return a maximum of 50 buckets (when using `buckets_count`) or 2000 data points (when using `resolution`).
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the project
      - name: filters
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Filters'
        description: Search filters to restrict the events reported in the trend
      - name: filter_groups
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AdvancedFiltersFilterGroups'
      - name: filter_groups_join
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FilterGroupsJoinOperator'
      - name: buckets_count
        in: query
        required: false
        schema:
          type: number
        description: Number of buckets to group trend data into (max 50)
      - name: resolution
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 30m
          - 2h
          - 12h
        description: The trend data will be grouped so that each bucket spans the given time period
      responses:
        '200':
          description: Trend data for the project (bucketed or unbucketed).
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/Trend1'
                  - $ref: '#/components/schemas/Trend2'
        '400':
          description: '- Returned when the number of data points required to respond to the request would exceed the maximum.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                - Buckets count must be between 1 and 50
                - Too many data points requested. Please use a narrower time range or lower resolution.
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
  /projects/{project_id}/errors/{error_id}/pivots:
    get:
      tags:
      - Errors
      summary: List Pivots on an Error
      operationId: listPivotsOnAnError
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        example: 337515fb9c1074f6fd000001
      - name: error_id
        in: path
        required: true
        schema:
          type: string
      - name: filters
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Filters'
      - name: filter_groups
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AdvancedFiltersFilterGroups'
      - name: filter_groups_join
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FilterGroupsJoinOperator'
      - name: summary_size
        in: query
        required: false
        schema:
          type: number
        example: 10
      - name: pivots
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: per_page
        in: query
        required: false
        schema:
          type: number
          default: 30
        example: 30
      responses:
        '200':
          description: A list of pivots on the error.
          headers:
            Link:
              schema:
                type: string
                example: <https://api.bugsnag.com/projects/337515fb9c1074f6fd000001/errors/515fb9337c1074f6fd000001/pivots/?offset=2017-04-12T22:50:04Z>; rel="next"
            X-Total-Count:
              schema:
                type: integer
                example: 123
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PivotApiView'
        '400':
          description: Request validation error. See `errors` for specific details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                - summary_size must be a number
        '404':
          description: '- Error could not be found. Check the supplied `error_id`.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                - Error not found
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
  /projects/{project_id}/errors/{error_id}/pivots/{event_field_display_id}/values:
    get:
      tags:
      - Errors
      summary: List values of a Pivot on an Error
      operationId: getPivotValuesOnAnError
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        example: 337515fb9c1074f6fd000001
      - name: error_id
        in: path
        required: true
        schema:
          type: string
      - name: event_field_display_id
        in: path
        required: true
        schema:
          type: string
        example: app.release_stage
      - name: filters
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Filters'
      - name: filter_groups
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AdvancedFiltersFilterGroups'
      - name: filter_groups_join
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FilterGroupsJoinOperator'
          description: The operator to use when joining filter groups together.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - unsorted
        example: unsorted
      - name: base
        in: query
        required: false
        schema:
          type: string
          format: date-time
        example: '2017-04-12T22:50:04Z'
      - name: per_page
        in: query
        required: false
        schema:
          type: number
          default: 30
        example: 30
      responses:
        '200':
          description: A list of pivot values on the error.
          headers:
            Link:
              schema:
                type: string
                example: <https://api.bugsnag.com/projects/337515fb9c1074f6fd000001/errors/515fb9337c1074f6fd000001/pivots/release.stage/values?offset=2017-04-12T22:50:04Z>; rel="next"
            X-Total-Count:
              schema:
                type: integer
                example: 123
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PivotValueApiView'
        '404':
          description: '- Error could not be found. Check the supplied `error_id`.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                - Error not found
        '422':
          description: 'The number of sorted results that can be obtained from this endpoint is limited. By default, results are sorted by descending Event occurrences. If you receive this error, you may still obtain complete results by setting the "sort" parameter to "unsorted".

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                  code:
                    type: integer
              example:
                errors:
                - Unable to return complete results
                code: 60000
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
  /projects/{project_id}/pivots/{event_field_display_id}/values:
    get:
      tags:
      - Errors
      summary: List values of a Pivot on a Project
      operationId: getPivotValuesOnAProject
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: event_field_display_id
        in: path
        required: true
        schema:
