components:
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      description: The unique identifier of the organization.
      schema:
        type: string
    PerPage:
      name: per_page
      in: query
      description: The number of results to return per page. Used for pagination.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
  schemas:
    User:
      type: object
      description: Represents an authenticated Bugsnag user account.
      properties:
        id:
          type: string
          description: The unique identifier of the user.
        name:
          type: string
          description: The full name of the user.
        email:
          type: string
          format: email
          description: The email address associated with the user account.
        gravatar_url:
          type: string
          format: uri
          description: The Gravatar URL for the user's profile image.
        html_url:
          type: string
          format: uri
          description: The URL to the user's Bugsnag dashboard profile.
    Error:
      type: object
      description: An API error response.
      properties:
        errors:
          type: array
          items:
            type: string
          description: List of error messages.
    Organization:
      type: object
      description: Represents a Bugsnag organization, the top-level entity containing projects and collaborators.
      properties:
        id:
          type: string
          description: The unique identifier of the organization.
        name:
          type: string
          description: The name of the organization.
        slug:
          type: string
          description: The URL-friendly slug for the organization.
        creator:
          $ref: '#/components/schemas/User'
        billing_email:
          type: string
          format: email
          description: The billing email address for the organization.
        auto_upgrade:
          type: boolean
          description: Whether the organization automatically upgrades to new plans.
        created_at:
          type: string
          format: date-time
          description: The date and time the organization was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time the organization was last updated.
    TeamMembershipsAddUsersRequest:
      type: object
      properties:
        collaborator_ids:
          type: array
          items:
            type: string
          description: Collaborators to add to the team.
        add_all_collaborators:
          type: boolean
          description: Add all organization collaborators to the team. This should not be set if `collaborator_ids` is specified.
    SuggestedTeamCollaboratorApiView:
      type: object
      properties:
        id:
          type: string
          example: 515fb9337c1074f6fd000007
          description: The ID of the collaborator
        name:
          type: string
          example: James Smith
          description: The name of the collaborator
        email:
          type: string
          example: james@example.com
          description: The email of the collaborator
        has_access:
          type: boolean
          example: true
          description: Whether the user has access to the team already
      required:
      - id
      - name
      - email
      - has_access
    ProjectType:
      type: string
      enum:
      - android
      - angular
      - asgi
      - aspnet
      - aspnet_core
      - backbone
      - bottle
      - cocos2dx
      - connect
      - django
      - dotnet
      - dotnet_desktop
      - dotnet_mvc
      - electron
      - ember
      - eventmachine
      - expo
      - express
      - flask
