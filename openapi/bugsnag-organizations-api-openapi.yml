    EventDataRequestApiView:
      type: object
      properties:
        id:
          type: string
          example: 5bf49d97468ce913212ae486
          description: ID of the event data request
        url:
          type: string
          description: URL for downloading the report of the requested event data. This may be a signed URL that is accessible for short amount of time.<br><br>This field is not present for on-premise installations. You can check event data requests in on-premise through the Minio UI by port forwarding it using `kubectl -n bugsnag port-forward svc/minio 9000:9000` and opening the Minio UI at http://localhost:9000. The access key and secret key can be retrieved via `kubectl -n bugsnag get secret minio -o jsonpath='{.data.accesskey}' | base64 -d; echo` and `kubectl -n bugsnag get secret minio -o jsonpath='{.data.secretkey}' | base64 -d; echo` respectively. Single node installations should omit `-n bugsnag` from commands.
        status:
          $ref: '#/components/schemas/EventDataRequestStatus'
          example: ACCEPTED
          description: status of the request
        total:
          type: number
          example: 10
          description: the total number of events that are expected to be returned; this field will be null if the status is `PREPARING`
        report_type:
          $ref: '#/components/schemas/EventDataRequestReportType'
          description: the type of report to return; this is blank if all event fields were requested
        filters:
          $ref: '#/components/schemas/Filters'
          description: The filters used to determine which events will be included in the report. See [Filtering](https://developer.smartbear.com/bugsnag/docs/data-access-filtering) for details.
        filter_groups:
          items:
            $ref: '#/components/schemas/FilterGroup'
          description: The filter groups used to determine which events to delete. See [Filtering](https://developer.smartbear.com/bugsnag/docs/data-access-filtering) for details.
        filter_groups_join:
          type: string
          enum:
          - AND
          - OR
          description: The logical operator used to join the filter groups. See [Filtering](https://developer.smartbear.com/bugsnag/docs/data-access-filtering) for details.
        created_at:
          type: string
          example: '2018-11-21T01:31:25.000Z'
          description: when the request was created
        completed_at:
          type: string
          example: '2018-11-21T01:35:00.000Z'
          description: when the request was completed
        expires_at:
          type: string
          example: '2018-11-28T01:35:00.000Z'
          description: when the request expires (and any stored data is removed)
      required:
      - id
      - status
      - filters
      - created_at
    EventDataRequestReportType:
      type: string
      enum:
      - gdpr
      description: only include event fields that pertain to the user such as event.user, event.device, and event.request; you may need to remove/redact some fields before giving this data to your users that request it
