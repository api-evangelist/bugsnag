    post:
      tags:
      - Organizations
      summary: Create an event data request
      operationId: organizationEventDataRequests
      description: 'Request event data for the given organization. This request will start an asynchronous job to collate all event data present at the time of the request and return a URL where you can download the data when the job is complete. These endpoints are intended for bulk download of events. If you want to query events, use the Events APIs instead.

        User data will not be included in the bulk download unless the request''s `report_type` attribute is set to `gdpr`. With the `report_type` set to `gdpr` Bugsnag will only return user-related metadata.'
      parameters:
      - name: organization_id
        in: path
        description: ID of the organization to request events for
        required: true
        schema:
          type: string
        example: 5bf5b201468ce95aa753a35f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                report_type:
                  $ref: '#/components/schemas/EventDataRequestReportType'
                  description: the type of report to request; omit this if you want all event fields
                filters:
                  $ref: '#/components/schemas/Filters'
                  description: 'The filters used to determine which events will be included in the report. See [Filtering](https://developer.smartbear.com/bugsnag/docs/data-access-filtering) for details.

                    '
                filter_groups:
                  $ref: '#/components/schemas/AdvancedFiltersFilterGroups'
                filter_groups_join:
                  $ref: '#/components/schemas/FilterGroupsJoinOperator'
                  description: The operator to use when joining filter groups together.
              required:
              - filters
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDataRequestApiView'
