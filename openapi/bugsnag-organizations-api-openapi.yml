openapi: 3.2.0
info:
  title: Bugsnag Organizations API
  version: '1.0'
  description: 'Operations tagged Organizations across 2 of this provider''s published API definitions: bugsnag-data-access-openapi.yml, bugsnag-organizations-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.bugsnag.com
  description: Bugsnag Production API Server
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
- description: For organizations with projects on app.bugsnag.smartbear.com
  url: https://api.bugsnag.smartbear.com
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
security:
- tokenAuth: []
tags:
- name: Organizations
  description: Access and manage organizations. An organization is the top-level entity in Bugsnag that contains projects and collaborators.
paths:
  /user/organizations:
    get:
      operationId: listOrganizations
      summary: List organizations
      description: Returns a list of organizations that the currently authenticated user belongs to. Results are paginated using the Link header.
      tags:
      - Organizations
      parameters:
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: https://api.bugsnag.com
      description: Bugsnag Production API Server
  /organizations/{organization_id}:
    get:
      operationId: getOrganization
      summary: Get an organization
      description: Returns the details of a specific organization, including its name, slug, billing email, and creation date.
      tags:
      - Organizations
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: https://api.bugsnag.com
      description: Bugsnag Production API Server
  /organizations:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    post:
      tags:
      - Organizations
      summary: Create an Organization
      operationId: createOrganization
      description: Creates a new Bugsnag organization and adds the current user to it as an admin. Requires user authentication as the initial user of the organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the company or organization to create
                  example: Acme Co.
              required:
              - name
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationApiView'
        '400':
          description: The request was bad. Check the errors supplied in the response. Examples > - Heroku users and saml-authenticated users cannot create an organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Cannot create upstream billing organization
                  - SAML users cannot create organization
  /organizations/{id}:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    get:
      tags:
      - Organizations
      summary: View an Organization
      operationId: getOrganizationById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: the ID of the organization
        example: 515fb9337c1074f6fd000001
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationApiView'
        '404':
          $ref: '#/components/responses/organization_not_found'
    patch:
      tags:
      - Organizations
      summary: Update an Organization
      operationId: updateOrganizationById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: the ID of the organization
        example: 515fb9337c1074f6fd000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationApiView'
        '400':
          description: '- This Organization type cannot be updated via the API. Example: Heroku organizations.

            - Organization does not have access to a required feature for the parameter being updated.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - cannot update upstream billing organization
                  - Default project event cap unavailable on plan
        '403':
          $ref: '#/components/responses/insufficient_organization_role'
        '404':
          $ref: '#/components/responses/organization_not_found'
    delete:
      tags:
      - Organizations
      summary: Delete an Organization
      operationId: deleteOrganization
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID of the organization
        example: 515fb9337c1074f6fd000001
      responses:
        '204':
          description: Organization deleted
        '400':
          description: This Organization cannot be deleted via the API. (e.g. Heroku organizations)
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - cannot delete upstream billing organization
        '403':
          $ref: '#/components/responses/insufficient_organization_role'
        '404':
          $ref: '#/components/responses/organization_not_found'
  /organizations/{id}/api_key:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    delete:
      tags:
      - Organizations
      summary: Regenerate an Organization's API key
      operationId: revokeOrganizationApiKey
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID of the organization
        example: 515fb9337c1074f6fd000001
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationApiView'
        '403':
          $ref: '#/components/responses/insufficient_organization_role'
        '404':
          $ref: '#/components/responses/organization_not_found'
  /organizations/{id}/auth_token:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    delete:
      tags:
      - Organizations
      summary: Regenerate an Organization's auth token
      operationId: revokeOrganizationAuthToken
      description: Deprecated. Use user-level authentication tokens instead.\nGenerate a new data access API auth token for the organization. This token allows you to read data from and write data to Bugsnag relating to your Organization, Projects, Errors, etc. After regenerating the auth token, the prior data access API auth token will no longer be supported. Note that this key is different from the project-level notifier API key that you use to identify a project to Bugsnag when you report errors.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID of the organization
        example: 515fb9337c1074f6fd000001
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationApiView'
        '403':
          $ref: '#/components/responses/insufficient_organization_role'
        '404':
          $ref: '#/components/responses/organization_not_found'
  /organizations/{organization_id}/collaborators/{id}:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    get:
      tags:
      - Organizations
      summary: Show a Collaborator on an Organization
      operationId: getOrganizationCollaborator
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the organization
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: the ID of the collaborator
      responses:
        '200':
          description: Collaborator details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollaboratorApiView'
        '403':
          description: You do not have permission to view this data. You must be an admin of the Organization.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Organization Administrator role required
        '404':
          description: An organization with the ID you provided or a user with the ID you provided could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Organization not found
                  - User not found
    patch:
      tags:
      - Organizations
      summary: Update a Collaborator's permissions
      operationId: updateOrganizationCollaborator
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: the ID of your organization
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: the ID of the collaborator to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_ids:
                  type: array
                  items:
                    type: string
                  description: The ids of projects in the current organization that the invited user should have access to.
                project_roles:
                  type: object
                  additionalProperties:
                    type: string
                  description: The IDs of the projects to which the user should have access, and the roles they should have, either 'project_owner' or 'project_member'.
                admin:
                  type: boolean
                  description: Whether to give admin permissions to the user.
      responses:
        '200':
          description: Collaborator updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollaboratorApiView'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Cannot update upstream billing collaborator
        '403':
          description: You do not have permission to update collaborators or invalid project_roles/project_ids.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: string
                  example:
                    errors:
                    - Organization Administrator role required
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: string
                  example:
                    errors:
                    - Project member roles are not enabled for the current plan
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: string
                  example:
                    errors:
                    - project_roles cannot be specified at the same time as project_ids
        '404':
          description: An organization with the ID you provided or a user with the ID you provided could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Organization not found
                  - User not found
    delete:
      tags:
      - Organizations
      summary: Delete a Collaborator
      operationId: deleteOrganizationCollaborator
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: the ID of your organization
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: the ID of the collaborator to update
      responses:
        '204':
          description: Collaborator deleted
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Cannot remove last admin
        '403':
          description: You do not have permission to update collaborators.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Organization Administrator role required
        '404':
          description: An organization with the ID you provided or a user with the ID you provided could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Organization not found
                  - User not found
  /organizations/{organization_id}/collaborators/bulk_invite:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    post:
      tags:
      - Organizations
      summary: Bulk invite collaborators to your organization
      operationId: bulkInviteOrganizationCollaborators
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: the ID of your organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emails:
                  type: array
                  items:
                    type: string
                  description: A list of emails to invite
                project_ids:
                  type: array
                  items:
                    type: string
                  description: The ids of projects in the current organization that the invited user should have access to. Leave blank if the admin field is set to true. Admins have access to all projects. Only one of project_roles and project_ids may be supplied.
                project_roles:
                  type: object
                  additionalProperties:
                    type: string
                  description: The IDs of the projects to which the user should have access, and the roles they should have, either 'project_owner' or 'project_member'. Leave blank if the admin field is set to true. Admins have access to all projects. Only one of project_roles and project_ids may be supplied. This field may only be supplied if the enterprise-roles feature is enabled for the account.
                admin:
                  type: boolean
                  description: Whether to give admin permissions to the invited user(s).
              required:
              - emails
      responses:
        '200':
          description: Collaborators invited
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollaboratorApiView'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Cannot add collaborators to SAML organization
                  - Bulk operation does not support 'name' parameter
                  - Too many invitations, please try again later.
        '403':
          description: '- You do not have permission to invite additional collaborators. It may be

            because your plan is at its seat limit and you need to upgrade your plan to

            add more collaborators, or you are not an admin on the Organization.

            - The `project_roles` parameter was supplied but your organization''s plan does not have this feature.

            - Both the `project_roles` and `project_ids` parameters were supplied.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                - You have reached your plan's collaborator limit of 30
                - Organization Administrator role required
                - Project member roles are not enabled for the current plan
                - project_roles cannot be specified at the same time as project_ids
        '404':
          description: An organization with the ID you provided could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Organization not found
  /projects/{project_id}/collaborators:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    get:
      tags:
      - Organizations
      summary: List Collaborators on a Project
      operationId: listProjectCollaborators
      description: List all collaborators that have access to a project.
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: the ID of the project
      - name: per_page
        in: query
        required: false
        schema:
          type: number
          default: 30
        description: Number of results per page
      responses:
        '200':
          description: A list of collaborators that have access to a project.
          headers:
            Link:
              schema:
                type: string
                example: <https://api.bugsnag.com/projects/515fb9337c1074f6fd000001/collaborators?offset=517c41f07c1074aee9000002>; rel="next"
            X-Total-Count:
              schema:
                type: integer
                example: 34
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollaboratorApiView'
        '404':
          description: A project with the ID you provided could not be found, or you do not have access to the project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Project not found
  /projects/{project_id}/collaborators/{id}:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    get:
      tags:
      - Organizations
      summary: Show a collaborator in a project
      operationId: getProjectCollaborator
      description: Show a collaborator in a project. Requires requesting user to have access to the given project.
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: the ID of the project
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: the ID of the collaborator
      responses:
        '200':
          description: Collaborator details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollaboratorApiView'
        '404':
          description: Not Found- - A project with the ID you provided could not be found, or you do not have access. - A collaborator with the ID you provided could not be found, or they do not have access to the project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Project not found
                  - User not found
  /organizations/{organization_id}/collaborators/project_access_counts:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    get:
      tags:
      - Organizations
      summary: View the project count of a collaborator
      operationId: getOrganizationCollaboratorProjectAccessCounts
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the organization
      - name: collaborator_ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
        description: IDs of collaborators to view the project count of
      responses:
        '200':
          description: A list of project access counts for the collaborators.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectAccessCountsApiView'
        '403':
          description: The collaborator ids must be in an array format
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Collaborator_ids must be an array
        '404':
          description: Not Found - - You do not have permission to view this data. You must be an admin of the organization. - A collaborator was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                  - Organization Administrator role required
                  - Collaborator not found
  /organizations/{organization_id}/collaborators/{collaborator_id}/projects:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    get:
      tags:
      - Organizations
      summary: View Projects a Collaborator has access to
      operationId: getOrganizationCollaboratorProjects
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: the ID of the organization
      - name: collaborator_id
        in: path
        required: true
        schema:
          type: string
        description: the ID of the user
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Search projects with names matching parameter
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - created_at
          default: created_at
        description: Which field to sort the results by
      - name: direction
