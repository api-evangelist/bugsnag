        first_released_at:
          type: string
          example: '2019-06-06T15:30:00.000Z'
          description: when the first release of this release group was released
        first_release_id:
          type: string
          example: 5a8f7294d1befa07f361fcde
          description: ID of first release of this release group
        releases_count:
          type: number
          example: 1
          description: Number of releases that belong to this release group. This will be 1 for releases that don't use secondary versions.
        has_secondary_versions:
          type: boolean
          example: false
          description: Whether the releases in this release group use secondary versions (version code or bundle version). This is usually true for mobile projects and false for non-mobile projects.
        build_tool:
          type: string
          example: webpack-bugsnag-plugins
          description: tool used to report the first release of this release group
        builder_name:
          type: string
          example: Daniel Deployer
          description: name of person or system that triggered the first release/build of this release group
        source_control:
          $ref: '#/components/schemas/ReleaseGroupSourceControl'
          description: source control related information about the first release of this release group
        total_sessions_count:
          type: number
          example: 3409
          description: total number of sessions seen for this release group. This field will be returned if the current Plan supports stability monitoring.
        unhandled_sessions_count:
          type: number
          example: 6
          description: number of sessions in this release group that had at least one unhandled event. Session Stability can be computed with (1 - (unhandled_sessions_count / total_sessions_count)) * 100. This field will be returned if the current Plan supports stability monitoring.
        sessions_count_in_last_24h:
          type: number
          example: 498
          description: number of sessions seen in the last 24 hours for this release group. This field will be returned if the current Plan supports stability monitoring.
        accumulative_daily_users_seen:
          type: number
          example: 5124
          description: number of user with at least one session in this release group. This field will be returned if the current Plan supports stability monitoring.
        accumulative_daily_users_with_unhandled:
          type: number
          example: 11
          description: number of user sessions with at least one unhandled event. User Stability can be computed with (1 - (accumulative_daily_users_with_unhandled / accumulative_daily_users_seen)) * 100. This field will be returned if the current Plan supports stability monitoring.
        top_release_group:
          type: boolean
          example: true
          description: whether this release group is a top release
        visible:
          type: boolean
          example: true
          description: whether this release group is visible
