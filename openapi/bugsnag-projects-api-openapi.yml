openapi: 3.2.0
info:
  title: Bugsnag Projects API
  version: '1.0'
  description: 'Operations tagged Projects across 2 of this provider''s published API definitions: bugsnag-data-access-openapi.yml, bugsnag-projects-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.bugsnag.com
  description: Bugsnag Production API Server
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
- description: For organizations with projects on app.bugsnag.smartbear.com
  url: https://api.bugsnag.smartbear.com
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
security:
- tokenAuth: []
tags:
- name: Projects
  description: Access and manage projects within an organization. Projects represent individual applications being monitored by Bugsnag.
paths:
  /organizations/{organization_id}/projects:
    get:
      operationId: listOrganizationProjects
      summary: List organization projects
      description: Returns a list of projects belonging to the specified organization. Results are paginated using the Link header.
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/PerPage'
      - name: sort
        in: query
        description: The field to sort results by. Supported values include created_at and name.
        schema:
          type: string
          enum:
          - created_at
          - name
      - name: direction
        in: query
        description: The sort direction, either ascending or descending.
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProject
      summary: Create a project
      description: Creates a new project within the specified organization. Returns the newly created project including its API key.
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: https://api.bugsnag.com
      description: Bugsnag Production API Server
  /projects/{project_id}:
    get:
      operationId: getProject
      summary: Get a project
      description: Returns the details of a specific project, including its name, API key, type, and configuration settings.
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateProject
      summary: Update a project
      description: Updates the settings of an existing project, such as its name or notification configuration.
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: Permanently deletes a project and all of its associated data, including errors, events, and collaborator assignments.
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Project deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: https://api.bugsnag.com
      description: Bugsnag Production API Server
  /projects/{project_id}/api_key:
    delete:
      operationId: regenerateProjectApiKey
      summary: Regenerate a project API key
      description: Regenerates the API key for a project. The old API key will immediately stop working and a new key will be generated.
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: https://api.bugsnag.com
      description: Bugsnag Production API Server
  /projects/{project_id}/upload_api_key:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    delete:
      tags:
      - Projects
      operationId: regenerateProjectUploadApiKey
      summary: Regenerate a Project's upload API key
      description: Generate a new upload API key for a project. This API key is used to authenticate file upload requests (source maps, proguard files, etc.). After regenerating a Project's upload API key, your upload scripts will need to be updated to use the new key. The previous key will not be supported. Note that a Project's upload API key is different from the notifier API key, Organization-level API key, and User-level Data Access API auth tokens.
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the project
        example: 515fb9337c1074f6fd000001
      responses:
        '200':
          description: The projects upload API key was successfully regenerated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectApiView'
        '403':
          $ref: '#/components/responses/insufficient_project_role'
        '404':
          $ref: '#/components/responses/project_not_found'
  /projects/{project_id}/event_fields:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    post:
      tags:
      - Projects
      summary: Create a custom Event Field
      operationId: createProjectEventField
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the Project
        example: 515fb9337c1074f6fd000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventFieldCreateRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventField'
        '400':
          description: The request was bad. Check the errors supplied in the response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                - At custom event field limit
        '403':
          $ref: '#/components/responses/insufficient_project_role'
        '404':
          description: Project could not be found. Check the supplied `project_id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                - Project not found
  /projects/{project_id}/event_fields/{display_id}:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    patch:
      tags:
      - Projects
      summary: Update a custom Event Field
      operationId: updateProjectEventFieldByDisplayId
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the Project
        example: 515fb9337c1074f6fd000001
      - name: display_id
        in: path
        required: true
        schema:
          type: string
        description: human friendly ID for the EventField
        example: user.id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventFieldCreateRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventField'
        '403':
          $ref: '#/components/responses/insufficient_project_role'
        '404':
          description: Unsupported or unrecognized event field id, or project could not be found. Check the supplied `project_id` and supplied `display_id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                - Project not found
                - Event field not found
    delete:
      tags:
      - Projects
      summary: Delete a custom Event Field
      operationId: deleteProjectEventFieldByDisplayId
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the Project
        example: 515fb9337c1074f6fd000001
      - name: display_id
        in: path
        required: true
        schema:
          type: string
        description: human friendly ID for the EventField
        example: user.id
      responses:
        '204':
          description: The event field was successfully deleted.
        '403':
          $ref: '#/components/responses/insufficient_project_role'
        '404':
          description: Unsupported or unrecognized event field id, or project could not be found. Check the supplied `project_id` and supplied `display_id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                - Project not found
                - Event field not found
  /projects/{project_id}/release_groups:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    get:
      tags:
      - Projects
      operationId: listProjectReleaseGroups
      summary: List Release Groups on a Project
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the project
        example: 515fb9337c1074f6fd000003
      - name: release_stage_name
        in: query
        required: true
        schema:
          type: string
        description: name of release stage to list release groups for
        example: production
      - name: top_only
        in: query
        required: false
        schema:
          type: boolean
        description: return only the top release groups (default false)
        example: true
      - name: visible_only
        in: query
        required: false
        schema:
          type: boolean
        description: return only visible release groups (default false)
        example: true
      - name: per_page
        in: query
        required: false
        schema:
          type: number
        description: how many results to return per page
        example: 30
      - name: page_token
        in: query
        required: false
        schema:
          type: string
        description: value from the next relation in the Link response header to obtain the next page of results
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReleaseGroup'
        '404':
          $ref: '#/components/responses/project_not_found'
  /release_groups/{id}:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    get:
      tags:
      - Projects
      operationId: getReleaseGroup
      summary: Retrieve a Release Group
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID of release group to get
        example: 5cf9a562d1befa0021e6a600
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseGroup'
        '404':
          description: Release group could not be found. Check the supplied `id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                    - Release group not found
    patch:
      tags:
      - Projects
      operationId: updateReleaseGroup
      summary: Update a Release Group
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID of release group to update
        example: 5cf9a562d1befa0021e6a600
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - visible
              properties:
                visible:
                  type: boolean
                  description: the updated visibility
                  example: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseGroup'
        '404':
          description: Release group could not be found. Check the supplied `id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                    - Release group not found
  /release_groups/{release_group_id}/releases:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    get:
      tags:
      - Projects
      summary: List Releases on a Release Group
      operationId: listReleaseGroupReleases
      parameters:
      - name: release_group_id
        in: path
        required: true
        schema:
          type: string
        description: ID of release group to list releases for
        example: 5d24fd08d1befa004a0e83e7
      - name: per_page
        in: query
        required: false
        schema:
          type: number
        description: how many results to return per page
        example: 30
      - name: page_token
        in: query
        required: false
        schema:
          type: string
        description: value from the next relation in the Link response header to obtain the next page of results
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReleaseApiView'
        '404':
          description: Release group could not be found. Check the supplied `release_group_id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                    - Release group not found
  /projects/{project_id}/event_data_requests:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    post:
      tags:
      - Projects
      summary: Create an event data request
      operationId: createProjectEventDataRequest
      description: 'Request event data for the given project. This request will start an asynchronous job to collate all event data present at the time of the request and return a URL where you can download the data when the job is complete. These endpoints are intended for bulk download of events. If you want to query events, use the Events APIs instead.

        User data will not be included in the bulk download unless the request''s `report_type` attribute is set to `gdpr`. With the `report_type` set to `gdpr` Bugsnag will only return user-related metadata.'
      parameters:
      - name: project_id
        in: path
        description: ID of the project to request events for
        required: true
        schema:
          type: string
        example: 5bf5b201468ce95aa753a35f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                report_type:
                  $ref: '#/components/schemas/EventDataRequestReportType'
                  description: the type of report to request; omit this if you want all event fields
                filters:
                  $ref: '#/components/schemas/Filters'
                  description: 'The filters used to determine which events will be included in the report. See [Filtering](https://developer.smartbear.com/bugsnag/docs/data-access-filtering) for details.

                    '
                filter_groups:
                  $ref: '#/components/schemas/AdvancedFiltersFilterGroups'
                filter_groups_join:
                  $ref: '#/components/schemas/FilterGroupsJoinOperator'
              required:
              - filters
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDataRequestApiView'
  /projects/{project_id}/event_data_requests/{id}:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    get:
      tags:
      - Projects
      summary: Check the status of an event data request
      operationId: getProjectEventDataRequestById
      parameters:
      - name: project_id
        in: path
        description: ID of the project of the event data request
        required: true
        schema:
          type: string
        example: 5bf5b201468ce95aa753a35f
      - name: id
        in: path
        description: ID of the event data request
        required: true
        schema:
          type: string
        example: 5bf5bde1468ce95b0a6724e8
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDataRequestApiView'
  /projects/{project_id}/event_data_deletions:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    post:
      tags:
      - Projects
      summary: Create an event deletion request
      operationId: createProjectEventDataDeletion
      description: Creates a request to asynchronously delete events for the project. Note that filters such as `user.email` and `user.name` use substring matching, so using the `user.id` filter will be more appropriate for deleting events for 1 specific user.
      parameters:
      - name: project_id
        in: path
        description: ID of the project to delete events from
        required: true
        schema:
          type: string
        example: 5bf5c369468ce95b0a6734c9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skip_confirmation:
                  type: boolean
                  description: whether to skip requiring another request to confirm the deletion
                  default: false
                filters:
                  $ref: '#/components/schemas/Filters'
                  description: 'The filters used to determine which events will be deleted. See [Filtering](https://developer.smartbear.comhttps://developer.smartbear.com/bugsnag/docs/data-access-filtering) for details. Note that filters with an empty string value and filters that don''t apply to a project (e.g. using a custom filter from one project on another project that doesn''t have that custom filter) will be skipped. Before proceeding with an event data deletion request, it''s recommended to verify the [project''s event fields](https://developer.smartbear.com/bugsnag/docs/bugsnag-data-access-api/Projects/listProjectEventFields) and test your filters using the [List the Events on an Error](https://developer.smartbear.com/bugsnag/docs/bugsnag-data-access-api/Errors/listEventsOnError) or [Create an event data request](https://developer.smartbear.com/bugsnag/docs/bugsnag-data-access-api/Projects/createProjectEventDataRequest) API.

                    '
                filter_groups:
                  $ref: '#/components/schemas/AdvancedFiltersFilterGroups'
                filter_groups_join:
                  $ref: '#/components/schemas/FilterGroupsJoinOperator'
              required:
              - filters
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDataDeletionApiView'
  /projects/{project_id}/event_data_deletions/{id}/confirm:
    servers:
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear-public/bugsnag-data-access-api/2
    - description: For organizations with projects on app.bugsnag.com
      url: https://api.bugsnag.com
    - description: For organizations with projects on app.bugsnag.smartbear.com
      url: https://api.bugsnag.smartbear.com
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/smartbear/bugsnag-data-access-api/2
    post:
      tags:
      - Projects
      summary: Confirm an event deletion request
      operationId: confirmProjectEventDataDeletion
      parameters:
      - name: project_id
        in: path
        description: ID of the project of the deletion request
        required: true
        schema:
          type: string
        example: 5bf5c369468ce95b0a6734c9
      - name: id
        in: path
        description: ID of the deletion request
        required: true
        schema:
          type: string
        example: 5bf5c5ee468ce95db8170d15
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDataDeletionApiView'
  /projects/{project_id}/event_data_deletions/{id}:
