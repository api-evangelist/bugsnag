    SeverityOptions:
      type: string
      enum:
      - info
      - warning
      - error
      description: '- info - can be used in manual Bugsnag.notify calls

        - warning - the default severity when Bugsnag.notify is called manually

        - error - the default severity for uncaught exceptions and crashes

        '
    PerformanceScoreTimelinePoint:
      type: object
      required:
      - bucket_start
      - bucket_end
      properties:
        bucket_start:
          type: string
          example: '2018-11-21T00:00:00.000Z'
          description: Timestamp representing the start point of the bucketed performance score, inclusive.
        bucket_end:
          type: string
          example: '2018-11-22T00:00:00.000Z'
          description: Timestamp representing the end point of the bucketed performance score, exclusive.
        performance_score:
          type: number
          example: 0.95
          description: The performance score for the time period, between 0.0 and 1.0.
        span_count:
          type: number
          example: 15000
          description: The number of Spans that qualified towards the Performance Score in the bucket period
    ProjectBase:
      type: object
      properties:
        name:
          type: string
          example: Example Project
        global_grouping:
          type: array
          description: 'A list of error classes. Events with these classes will be grouped by their

            class, regardless of the location that they occur in the Project''s source

            code. Altering a Project''s `global_grouping` will not cause existing errors

            to be regrouped.


            Note: In the UI this is referred to as grouping by error class.


            Example:


            ```

            ["foo", "bar"]

            ```

            '
          items:
            example:
            - Redis::CannotConnectError
            - Mongo::Error:SocketError
        location_grouping:
          type: array
          description: 'A list of error classes. Events with these classes will be grouped by their

            `context`. Altering a Project''s `location_grouping` will not cause existing errors

            to be regrouped.


            Note: In the UI this is referred to as grouping by error context.

            '
          items:
            example:
            - Timeout::Error
        discarded_app_versions:
          type: array
          description: 'A list of app versions whose events will be [discarded](https://docs.bugsnag.com/product/event-usage/#discard-by-app-version) if received for the Project. Supports [regular expressions](https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Global_Objects/RegExp#Special_characters_meaning_in_regular_expressions) and [semver ranges](https://github.com/npm/node-semver#ranges). Errors matching these versions won''t be processed by Bugsnag, and you won''t receive notifications about them.

            '
          items:
            example:
            - alpha
            - < 2.2.2
            - 3.0.0
        discarded_errors:
          type: array
          description: 'A list of Error classes whose events will be [discarded](https://docs.bugsnag.com/product/event-usage/#discard-by-error-class) if received for the Project. Errors with these classes won''t be processed by Bugsnag, and you won''t receive notifications about them.

            '
          items:
            example:
            - Example::Error
        url_whitelist:
          type: array
          description: 'When configured, the script source of each error''s innermost stack trace''s top frame is checked. If the script was not served from a matching domain the error will not be processed by BugSnag and will be discarded.


            Provide a list of newline separated domain names. To match example.com and its subdomains specify *.example.com.


            Relevant to JavaScript Projects only.

            '
          items:
            example:
            - example.com
        ignore_old_browsers:
          type: boolean
          example: true
          description: 'Whether the Events in the Project will be ignored if they originate from

            old web browsers.


            Relevant to JavaScript Projects only.

            '
        ignored_browser_versions:
          type: object
          description: 'Relevant to JavaScript Projects only.


            A mapping a of browser name to browser version. If set, Events in the

            Project will be ignored if they originate from a browser specified here

            whose version is earlier than the given version.


            Keys must be one of the following strings: chrome, ie, firefox, safari, android, uc, opera, opera_mini, samsung, blackberry, sogou, other.


            Values must be a number indicating which which version to ignore up to (but not including), or one of the strings: `ignore_all`, `ignore_none`


            Example:


            ```

            {

            "chrome": "ignore_none",

            "safari": 6,

            "other": "ignore_all"

            }

            ```

            '
        resolve_on_deploy:
          type: boolean
          example: true
          description: 'If true, every error in the Project will be marked as ''fixed'' after using the Deploy Tracking API to notify Bugsnag of a new production deploy.


            Applies to non-JavaScript Projects only.

            '
    ReleaseApiView:
      type: object
      properties:
        id:
          type: string
          example: 5a8f7294d1befa07f361fcde
          description: ID of the release
        project_id:
          type: string
          example: 5a907f72d1befa043987dedf
          description: ID of project this release belongs to
        release_time:
          type: string
          example: '2018-02-21T21:30:16+00:00'
          description: when the release happened (in ISO 8601 format)
        release_source:
          $ref: '#/components/schemas/ReleaseRequestSource'
          description: what was responsible for creating the release
        app_version:
          type: string
          example: 1.2.3
          description: version name/number
        app_version_code:
          type: string
          example: '1234'
          description: version code of release (applicable to Android)
        app_bundle_version:
          type: string
          example: 1.2.3
          description: bundle version/build number of release (applicable to iOS/macOS/tvOS)
        build_label:
          type: string
          example: 1.2.3
          description: auto-generated descriptive label describing the build
        builder_name:
          type: string
          example: Daniel Deployer
          description: name of person or system that triggered the release/build
        build_tool:
          type: string
          example: webpack-bugsnag-plugins
          description: tool used to report this release
        errors_introduced_count:
          type: number
          example: 2
          description: number of errors introduced in this release
        errors_seen_count:
          type: number
          example: 10
          description: number of errors that happened in this release
        sessions_count_in_last_24h:
          type: number
          example: 6500
          description: number of sessions started for this release in the last 24 hours
        total_sessions_count:
          type: number
          example: 3000
          description: number of sessions that started in this release
        unhandled_sessions_count:
          type: number
          example: 60
          description: number of sessions in this release that have seen at least one unhandled event. Session Stability can be computed with (1 - (unhandled_sessions_count / total_sessions_count)) * 100
        accumulative_daily_users_seen:
          type: number
          example: 5124
          description: number of user with at least one session in this release group
        accumulative_daily_users_with_unhandled:
          type: number
          example: 11
          description: number of user sessions with at least one unhandled event. User Stability can be computed with (1 - (accumulative_daily_users_with_unhandled / accumulative_daily_users_seen)) * 100
        metadata:
          type: object
          description: metadata about the release
        release_stage:
          type: object
          properties:
            name:
              type: string
              example: production
              description: name of the release stage
          description: information about this release's release stage
        source_control:
          $ref: '#/components/schemas/ReleaseSourceControl'
          description: source control related information about the release
        release_group_id:
          type: string
          example: 5cf9a562d1befa0021e6a600
          description: ID of release group that this release belongs to
